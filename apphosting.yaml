runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 512

env:
  - variable: BOOKING_URL
    value: "https://notaryhost.com"
    availability:
      - RUNTIME
  - variable: RESEND_API_KEY
    secret: resend-api-key
  - variable: TWILIO_ACCOUNT_SID
    secret: TWILIO_ACCOUNT_SID
  - variable: TWILIO_AUTH_TOKEN
    secret: TWILIO_AUTH_TOKEN
  - variable: TWILIO_PHONE_NUMBER_HOST
    secret: TWILIO_PHONE_NUMBER_HOST
  - variable: NEXT_PUBLIC_ADMIN_EMAIL
    secret: NEXT_PUBLIC_ADMIN_EMAIL
  - variable: NEXT_PUBLIC_ADMIN_PHONE
    secret: NEXT_PUBLIC_ADMIN_PHONE
  - variable: ADMIN_LOGIN_OTP_PEPPER
    secret: admin-login-otp-pepper
  - variable: TRANSFER_PHONE_NUMBER
    secret: TRANSFER_PHONE_NUMBER
